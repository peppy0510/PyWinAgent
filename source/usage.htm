<!doctype html>
<html class="wide">

<head>
<meta charset="utf-8">
<title>Usage</title>

<style>
:root {
    color-scheme: dark;
    /* PyWinAudio 랙과 같은 숯색 판. 앱이 setTheme 으로 테마 값을 덮어쓴다 (utilities.THEMES). */
    --bg: #141517;
    --face: #1d1f23;
    --band: #17181b;
    --rim: #2b2e33;
    --text: #e6e9ed;
    --dim: #8b929b;
    --faint: #5a5e65;
    --accent: #4c9aff;
    --on_accent: #101215;
    --control: #26282d;
    --control_hover: #2f3237;
    --control_down: #202226;
    --edge: #363940;
    --mint: #3fd6a0;
    --grid: #2c2f35;
    --warn: #ff9a3d;
    --close: #c42b1c;
    /* 넓은 창에서 그림이 뭉툭해지지 않게 폭은 활동 모자이크 폭에서 멈추고 가운데에 선다. */
    --chart-max: 368px;
    /* 그래프 계열색. 1 = 파랑(accent), 2 = 주황. 상태색(--warn·--close)과 따로 둔다.
       어두운 판의 2 번은 판 밝기 대역(OKLCH L 0.48–0.67)에 맞춰 낮췄다 — setTheme 참고.
       검증: 파랑↔주황 색약 ΔE 27.7 / 정상 시각 29.6 (dataviz validate_palette). */
    --series1: var(--accent);
    --series2: #c98430;
    /* 진행 막대는 모두 이 굵기·둥글기 하나로 (한도·세션 문맥·모델·주별·내역·색인 띠). */
    --bar-height: 6px;
    --bar-radius: 1px;
    /* 판 (PyWinAudio 랙): 모서리, 이름 띠 높이, 안쪽 여백, 판 사이 틈. wx 페이지와 같은 값. */
    --panel-radius: 3px;
    --band-height: 30px;
    --pad: 14px;
    --gap: 3px;
    /* 누르는 것은 모두 같은 키·옆 여백·글씨·사이 (wx 페이지의 BUTTON_*). */
    --button-height: 22px;
    --button-pad: 11px;
    --button-gap: 4px;
    --button-font: 400 11.3px "Segoe UI", sans-serif;
    --band-inset: 4px;
    --sunken: color-mix(in srgb, var(--face) 70%, var(--grid));
    --soft: color-mix(in srgb, var(--accent) 45%, var(--grid));
}

* { box-sizing: border-box; }

body {
    margin: 0;
    /* 창 가장자리와 판 사이는 위·아래·옆 모두 8px (wx 페이지의 PANEL_MARGIN). 옆 8px 는
       막대 자리(scrollbar-gutter) 그대로다. 양쪽에 똑같이 둬서 판이 막대 때문에 왼쪽으로
       쏠리지 않게 한다. */
    padding: 8px 0;
    background: var(--bg);
    color: var(--text);
    font: 13px "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
}

/* 판 ----------------------------------------------------------------
   PyWinAudio 랙 장치와 같은 모양: 한 톤 어두운 이름 띠(왼쪽 끝 강조색 줄, 접기 꺾쇠,
   대문자 굵은 제목, 흐린 부제, 오른쪽 끝 단추) 아래 1px 금, 그 아래 평평한 본체.
   띠를 누르면 접히고, 접은 판은 띠 한 줄만 남는다. */
section { margin-bottom: var(--gap); }

section > h2 {
    position: relative;
    display: flex;
    align-items: center;
    /* 띠 30px + 아래 금 1px. 띠 안의 단추(22px)는 띠 가장자리에서 위·아래·옆 모두 4px. */
    height: calc(var(--band-height) + 1px);
    margin: 0;
    padding: 0 var(--band-inset);
    border-bottom: 1px solid var(--rim);
    border-radius: var(--panel-radius) var(--panel-radius) 0 0;
    background: var(--band);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    white-space: nowrap;
}
section > h2::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 2px;
    border-radius: 1px;
    background: var(--accent);
}
section.folded > h2,
section > h2.solo { height: var(--band-height); border-bottom: 0; border-radius: var(--panel-radius); }
/* 접기 단추 = 꺾쇠 + 제목. 반응하는 것은 이 단추뿐이다 — 띠의 다른 단추에 손을 얹었을 때
   꺾쇠가 함께 밝아지면 안 된다(사용자). 제목이 없는 띠(solo)의 글씨도 같은 자리에 선다. */
h2 .fold {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    height: var(--button-height);
    margin: 0;
    padding: 0 8px 0 6px;
    border: 0;
    border-radius: var(--panel-radius);
    background: transparent;
    color: var(--text);
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    cursor: pointer;
}
h2 .fold svg { width: 10px; height: 10px; flex: none; color: var(--dim); }
h2 .fold:hover { background: var(--control_hover); }
h2 .fold:hover svg { color: var(--text); }
h2 .fold:active { background: var(--control_down); }
section.folded > h2 .fold svg { transform: rotate(-90deg); }
section > h2.solo { padding-left: calc(var(--band-inset) + 22px); }
section.folded > .card { display: none; }
/* 부제는 제목(단추) 뒤에 흐리게, 오른쪽 끝 단추는 tail 에. */
h2 .sub,
h2 .tail { font-weight: 400; letter-spacing: 0; text-transform: none; }
h2 .sub { min-width: 0; margin-left: 8px; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; color: var(--dim); }
section > h2.solo .sub { margin-left: 8px; }
h2 .tail { display: flex; margin-left: auto; padding-left: 8px; }

/* 넓은 창에서는 묶음을 여러 단으로 편다 (설정의 Wide layout 이 켜져 있을 때만).
   신문·문서의 단처럼 첫 단을 위에서 아래로 채우고 다음 단으로 넘어간다. 차례는
   설정 그대로, 끊는 자리는 단 높이가 가장 고르게 되는 곳 (layoutSections). 단 수는
   폭이 정한다: 820px 부터 2단, 1240px 부터 3단. */
#sections.masonry { display: flex; align-items: flex-start; gap: var(--gap); }
#sections.masonry > .masonry-column { flex: 1; min-width: 0; }

.card {
    background: var(--face);
    border-radius: 0 0 var(--panel-radius) var(--panel-radius);
    padding: var(--pad);
}

.caption {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.4px;
    color: var(--dim);
    text-transform: uppercase;
}
.note { font-size: 11px; color: var(--dim); }
.num { font-variant-numeric: tabular-nums lining-nums; }
.empty { padding: 6px 0; color: var(--dim); font-size: 12px; text-align: center; }

/* 둘셋 중 하나를 고르는 칸 묶음 (PyWinAudio 의 Segment). 칸마다 테두리를 두르고 고른
   칸만 강조색으로 채운다. 띠 안이든 본체든 같은 모양·크기. 고른 칸도 굵게 쓰지 않는다 —
   굵어지면 폭이 변해 누를 때마다 옆 칸이 밀린다(사용자). */
.seg {
    display: inline-flex;
    /* 좁은 창에서는 다음 줄로 넘긴다. 한 줄을 고집하면 판 밖으로 삐져나간다. */
    flex-wrap: wrap;
    gap: var(--button-gap);
    max-width: 100%;
}
h2 .seg { flex-wrap: nowrap; }
/* 글자 단추 공통. 글씨는 대문자 높이로 잘라(text-box) 상자 한가운데에 선다 — 글자 상자의
   위 여유·아래 내림 자리 때문에 그냥 두면 위아래로 치우친다(사용자). */
.seg button,
button.primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: var(--button-height);
    margin: 0;
    padding: 0 var(--button-pad);
    border: 1px solid var(--edge);
    border-radius: var(--panel-radius);
    background: var(--control);
    color: var(--text);
    font: var(--button-font);
    letter-spacing: 0;
    line-height: 1;
    text-transform: none;
    white-space: nowrap;
    cursor: pointer;
}
.seg button,
button.primary,
h2 .fold { text-box: trim-both cap alphabetic; }
.seg button:hover,
button.primary:hover { background: var(--control_hover); }
.seg button:active,
button.primary:active { background: var(--control_down); }
.seg button.on { border-color: var(--accent); background: var(--accent); color: var(--on_accent); }
button.primary[disabled] { color: var(--faint); background: var(--control); cursor: default; }
.controls { display: flex; flex-wrap: wrap; gap: var(--button-gap) 8px; align-items: center; margin-bottom: var(--pad); }
/* 그림 위의 고르기 단추는 그림과 같은 가운데 줄에 선다. */
.controls.center { justify-content: center; }
.controls .label { font-size: 9px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }

.link {
    border: 0;
    padding: 0;
    background: none;
    color: var(--accent);
    font: 11px "Segoe UI", sans-serif;
    cursor: pointer;
}
.link:hover { text-decoration: underline; }

/* 뼈대 — 첫 값이 오기 전 카드마다 실제 모양대로 자리를 잡아 둔다. 값이 오면서
   카드가 부풀어 오르지 않게. 깜빡임은 은은하게, 움직임 줄이기 설정이면 멈춘다. */
.sk { display: block; border-radius: var(--panel-radius); background: var(--grid); animation: sk-pulse 1.6s ease-in-out infinite; }
.sk.line { height: 9px; }
.sk-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sk-stack > * + * { margin-top: 6px; }
@keyframes sk-pulse { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

/* 알림 띠 ------------------------------------------------------------ */
.banner {
    position: relative;
    margin-bottom: var(--gap);
    padding: 8px var(--pad);
    border-radius: var(--panel-radius);
    background: var(--face);
    font-size: 12px;
}
.banner::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px; border-radius: 1px; background: var(--accent); }
.banner .bar { margin-top: 6px; height: var(--bar-height); border-radius: var(--bar-radius); background: var(--grid); overflow: hidden; }
.banner .bar > i { display: block; height: 100%; border-radius: var(--bar-radius); background: var(--accent); }

/* 머리판 ------------------------------------------------------------- */
.header { display: flex; justify-content: space-between; gap: 12px; }
.header .right { text-align: right; }
.header .value { margin: 2px 0; font-size: 15px; font-weight: 700; }
/* 지금 쓰는 플랜은 머리판 이름 띠의 부제 자리에. 좁으면 줄을 바꾸지 않고 잘린다. */
/* 눌리지 않는 글씨라 테두리를 두르지 않는다 — 단추처럼 보이면 안 된다. */
.plans { display: flex; flex-wrap: nowrap; gap: 10px; min-width: 0; overflow: hidden; }
.plan { flex: none; font-size: 10.5px; }
.plan .provider { margin-right: 4px; }

/* 한도 --------------------------------------------------------------- */
.limit + .limit { margin-top: var(--pad); }
.limit-group + .limit-group { margin-top: var(--pad); padding-top: var(--pad); border-top: 1px solid var(--rim); }
.limit-brand { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
.limit-brand .brand-icon { width: 14px; height: 14px; flex: none; }
.limit-brand.claude .brand-icon { border-radius: 3px; }
.limit-brand .brand-icon.on-dark { display: none; }
:root.dark .limit-brand .brand-icon.on-dark { display: block; }
:root.dark .limit-brand .brand-icon.on-light { display: none; }
.limit-brand .brand-name { font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
.limit-brand .brand-plan { font-size: 11px; color: var(--dim); }
/* 다 쓴 칸. 언제 다시 쓸 수 있는지가 이 줄에서 가장 궁금한 값이라 크게 둔다. */
.limit-lift { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
.limit-lift .time-left { font-size: 22px; font-weight: 700; line-height: 1.1; }
.limit-lift .lift-caption { font-size: 11px; color: var(--dim); }
/* 서버에 못 물어 지난 값을 보일 때. 까닭 한 줄을 위에 두고 막대는 옅게. */
.limit-note { margin-bottom: var(--pad); padding: 6px 8px; border-radius: var(--panel-radius); background: var(--sunken); font-size: 11px; color: var(--dim); }
.limit.stale { opacity: 0.55; }
.limit-note .limit-login { display: block; margin-top: 4px; }
.limit .head { display: flex; align-items: baseline; gap: 8px; }
.limit .name { font-size: 12px; }
.limit .when { flex: 1; font-size: 11px; color: var(--dim); }
.limit .elapsed { font-size: 11px; color: var(--dim); }
.limit .pct { font-weight: 600; }
/* 한 칸에 둘을 겹친다. 뒤의 옅은 막대가 창 전체 가운데 지나간 시간, 앞의 색
   막대가 쓴 몫이다. 색 막대가 옅은 막대를 앞지르면 이대로는 창이 끝나기 전에
   한도에 닿는다. */
.limit .bar {
    position: relative;
    margin-top: 5px;
    height: var(--bar-height);
    border-radius: var(--bar-radius);
    background: var(--grid);
    overflow: hidden;
}
.limit .bar > i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: var(--bar-radius); }
.limit .bar > .time { background: color-mix(in srgb, var(--dim) 45%, var(--grid)); }
/* Codex 강제 초기화 이용권. 이용권마다 만료가 따로라 한 장씩 남은 시간을 둔다.
   하루 안에 사라질 것은 주황 테두리에 '곧' 표시를 붙인다 (색만으로 가르지 않는다). */
.resets { margin-top: var(--pad); }
.resets .head { display: flex; align-items: baseline; gap: 8px; }
.resets .name { font-size: 12px; }
.resets .when { flex: 1; font-size: 11px; color: var(--dim); }
.resets .count { font-weight: 600; color: var(--accent); }
.resets.stale { opacity: 0.55; }
.reset-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.reset-chip { padding: 1px 7px; border: 1px solid var(--edge); border-radius: var(--panel-radius); font-size: 11px; color: var(--dim); }
.reset-chip b { font-weight: 600; color: var(--text); }
.reset-chip.soon { border-color: var(--warn); }
.reset-chip.soon b { color: var(--warn); }

/* 막대 그림 (추세·산출·시간대 공용). 0 에서 자라고, 막대 사이 2px 틈,
   끝만 둥글다. 음수는 0 선 아래로 주황. ------------------------------------ */
.chart { max-width: var(--chart-max); margin: 0 auto; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; font-size: 10px; color: var(--dim); }
.chart-head b { font-weight: 600; color: var(--text); }
.bars { position: relative; display: flex; gap: 2px; height: 64px; border-bottom: 1px solid var(--rim); }
.bars.small { height: 34px; }
.bars.signed { border-bottom: 0; }
.bars .zero { position: absolute; left: 0; right: 0; height: 1px; background: var(--rim); }
.bars > .slot { position: relative; flex: 1; min-width: 0; height: 100%; }
.bars > .slot[data-bucket] { cursor: pointer; }
.bars > .slot > i { position: absolute; left: 0; right: 0; background: color-mix(in srgb, var(--series1) 55%, var(--face)); border-radius: 2px 2px 0 0; }
.bars > .slot > i.neg { background: color-mix(in srgb, var(--series2) 70%, var(--face)); border-radius: 0 0 2px 2px; }
/* 지금 칸과 고른 칸만 진하게. 나머지와 같은 색이면 어디가 지금인지 안 읽힌다. */
.bars > .slot.now > i,
.bars > .slot.picked > i { background: var(--series1); }
.bars > .slot.now > i.neg,
.bars > .slot.picked > i.neg { background: var(--series2); }
.bars > .slot:hover > i { filter: brightness(1.2); }
.axis { display: flex; justify-content: space-between; margin-top: 4px; font-size: 9px; color: var(--dim); }
.chart + .chart { margin-top: var(--pad); }

/* 코드 산출 ---------------------------------------------------------- */
/* 아래 그림과 같은 폭에서 멈추고 가운데에 선다. 넓은 창에서 셋이 양끝으로 흩어지지 않게. */
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: var(--chart-max); margin: 0 auto; }
.kpi { text-align: center; }
.kpi .value { margin: 2px 0; font-size: 15px; font-weight: 700; }

/* 고른 칸의 내역 */
.breakdown { margin-top: var(--pad); padding-top: var(--pad); border-top: 1px solid var(--rim); }
.breakdown h3 { margin: 10px 0 6px; font-size: 11px; font-weight: 700; display: flex; justify-content: space-between; }
.breakdown h3:first-child { margin-top: 0; }
.breakdown h3 .note { font-weight: 400; }
.meter { display: grid; grid-template-columns: 92px 1fr auto; gap: 8px; align-items: center; margin-top: 4px; font-size: 11px; }
.meter .track { height: var(--bar-height); border-radius: var(--bar-radius); background: var(--grid); overflow: hidden; }
.meter .track i { display: block; height: 100%; border-radius: var(--bar-radius); background: var(--accent); }
.meter .val { color: var(--dim); text-align: right; white-space: nowrap; }

/* 세션 --------------------------------------------------------------- */
.session { padding: 8px 0; border-top: 1px solid var(--grid); }
.session:first-child { border-top: 0; padding-top: 0; }
.session .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.session .project { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session .ago { margin-left: auto; white-space: nowrap; }
.session .meta { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 3px; }
.session .ctx { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.session .ctx .track { flex: 1; height: var(--bar-height); border-radius: var(--bar-radius); background: var(--grid); overflow: hidden; }
.session .ctx .track i { display: block; height: 100%; border-radius: var(--bar-radius); background: var(--accent); }
.session .ctx .track i.near { background: var(--warn); }
.session .ctx .track i.full { background: var(--close); }
.session .actions { display: flex; gap: 10px; margin-top: 4px; }
.chip {
    padding: 1px 6px;
    border-radius: var(--panel-radius);
    font-size: 10px;
    white-space: nowrap;
    border: 1px solid var(--edge);
    color: var(--dim);
}
/* 상태는 색만으로 말하지 않는다. 글자와 테두리 굵기도 다르다. */
.chip.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chip.waiting { border-color: var(--warn); color: var(--warn); }
.provider { font-size: 10px; font-weight: 600; letter-spacing: 0.4px; color: var(--dim); white-space: nowrap; }
.provider::before {
    content: '';
    display: inline-block;
    width: 7px;
    height: 7px;
    margin-right: 4px;
    border-radius: 50%;
    vertical-align: 0;
    background: var(--dim);
}
.provider.claude::before { background: var(--series1); }
.provider.codex::before { background: var(--series2); }
.sessions-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }

/* 활동 --------------------------------------------------------------- */
/* 칸은 12px 에서 멈추고(넓은 창에서 뭉툭해지지 않게), 자리가 모자라면 그만큼
   줄어든다(좁은 창에서 카드 밖으로 넘치지 않게). 칸 높이는 폭을 따라 정사각형. */
/* 그림은 넓은 창에서 부풀지 않는다 — 칸이 커지면 뚱뚱해 보인다(사용자). 보기 좋은 크기(칸 12px,
   폭 --chart-max)에서 멈추고 판 가운데에 선다. 좁으면 그만큼 줄어든다. */
#activity { max-width: var(--chart-max); margin: 0 auto; }
.heat-box { width: fit-content; max-width: 100%; margin: 0 auto; }
.heat { display: grid; grid-template-columns: auto minmax(0, calc(24 * 12px + 23 * 2px)); gap: 2px 6px; }
.heat .row-label,
.heat .hour-label { font-size: 9px; color: var(--dim); line-height: 1; }
.heat .cells,
.heat .hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; }
.heat .cells > i { display: block; aspect-ratio: 1; border-radius: 1.5px; }
.heat .hour-label { white-space: nowrap; overflow: visible; }
.heat .row-label { align-self: center; }
.calendar { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, auto);
            grid-auto-columns: minmax(0, 12px); gap: 2px; }
.calendar > i { display: block; aspect-ratio: 1; border-radius: 1.5px; }
.calendar > i.blank { visibility: hidden; }
.week-row { display: grid; grid-template-columns: 70px 1fr 90px; gap: 8px; align-items: center; margin-top: 6px; font-size: 11px; }
.week-row .track { height: var(--bar-height); border-radius: var(--bar-radius); background: var(--grid); overflow: hidden; }
.week-row .track i { display: block; height: 100%; border-radius: var(--bar-radius); background: var(--soft); }
.week-row.current .track i { background: var(--accent); }
.tod { width: 100%; border-collapse: collapse; font-size: 11px; }
.tod th { font-weight: 400; color: var(--dim); text-align: right; padding: 3px 0; font-size: 10px; }
.tod th:first-child, .tod td:first-child { text-align: left; }
.tod td { text-align: right; padding: 4px 0; border-top: 1px solid var(--grid); }
.tod tr.peak td:first-child { color: var(--accent); font-weight: 700; }
.activity-caption { display: flex; justify-content: space-between; margin-top: 8px; }

.legend {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 3px;
    margin-top: 8px;
    font-size: 9px;
    color: var(--dim);
}
.legend i { display: block; width: 8px; height: 8px; border-radius: 1.5px; }
.legend span:first-child { margin-right: 3px; }
.legend span:last-child { margin-left: 3px; }

/* 모델 --------------------------------------------------------------- */
.model { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; margin-top: 8px; font-size: 12px; }
.model:first-child { margin-top: 0; }
.model .track { grid-column: 1 / -1; height: var(--bar-height); border-radius: var(--bar-radius); background: var(--grid); overflow: hidden; }
.model .track i { display: block; height: 100%; border-radius: var(--bar-radius); background: var(--accent); }

/* 막대는 굴리는 동안만 보인다. 자리는 늘 잡아 둬 나타날 때 내용이 밀리지 않는다.
   스크롤바 의사요소에는 transition 이 안 먹는다. 색을 등록된 변수(@property)로 두고
   그 변수를 html 에서 옮겨 가게 하면 막대가 따라 칠해진다 — 나타날 땐 바로,
   사라질 땐 0.4초에 걸쳐 (wx 페이지의 ScrollBar 와 같은 빠르기). */
@property --thumb {
    syntax: '<color>';
    inherits: true;
    initial-value: transparent;
}
html { --thumb: transparent; transition: --thumb 0.4s ease-out; }
html.scrolling { --thumb: var(--rim); transition: none; }
html { scrollbar-gutter: stable both-edges; }
/* 막대 자리 8px 가 곧 옆 여백이다. 막대는 그 가운데 4px (wx 페이지의 ScrollBar 와 같다). */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb {
    border: 2px solid transparent;
    border-radius: 4px;
    background-color: var(--thumb);
    background-clip: content-box;
}
</style>
</head>

<body>

<div class="banner" id="indexing" hidden>
    <div id="indexing-text">Indexing usage history…</div>
    <div class="bar"><i id="indexing-bar" style="width:0%"></i></div>
</div>

<div id="sections">

<section data-id="header">
    <h2>Overview <span class="plans sub" id="plans"></span><span class="tail"><span class="seg" data-control="headerPeriod"></span></span></h2>
    <div class="card header">
        <div>
            <div class="caption" id="cost-caption">Today cost</div>
            <div class="value num" id="cost">—</div>
            <div class="note num" id="calls"></div>
        </div>
        <div class="right">
            <div class="caption" id="ratio-caption">Cache efficiency</div>
            <div class="value num" id="ratio">—</div>
            <div class="note num" id="saved"></div>
        </div>
    </div>
</section>

<section data-id="planUsage">
    <h2>Plan Usage</h2>
    <div class="card" id="limits" data-skeleton="limits"></div>
</section>

<section data-id="codeOutput">
    <h2>Code Output <span class="tail"><span class="seg" data-control="codePeriod"></span></span></h2>
    <div class="card" id="code" data-skeleton="code"></div>
</section>

<section data-id="trend">
    <h2>Trend</h2>
    <div class="card">
        <div class="controls center">
            <span class="label">Metric</span><span class="seg" data-control="metric"></span>
            <span class="label">Range</span><span class="seg" data-control="grain"></span>
        </div>
        <div id="trend" data-skeleton="trend"></div>
        <div class="breakdown" id="breakdown" hidden></div>
    </div>
</section>

<section data-id="sessions">
    <h2>Sessions <span class="tail"><span class="seg" data-control="sessionFilter"></span></span></h2>
    <div class="card" id="sessions" data-skeleton="sessions"></div>
</section>

<section data-id="activity">
    <h2>Activity</h2>
    <div class="card">
        <div class="controls center"><span class="seg" data-control="activity"></span></div>
        <div id="activity" data-skeleton="activity"></div>
    </div>
</section>

<section data-id="modelUsage">
    <h2>Model Usage <span class="sub">Top 4 · all time</span></h2>
    <div class="card" id="models" data-skeleton="models"></div>
</section>

<section data-id="refresh">
    <h2 class="solo">Refresh <span class="sub" id="updated">Re-read the agent records</span><span class="tail"><button class="primary" id="reload">Reload</button></span></h2>
</section>

</div>

<script>
'use strict';

var LEVELS = 4;
var latest = null;
var view = {
    headerPeriod: 'today', codePeriod: 'today', metric: 'cost', grain: 'day',
    sessionFilter: 'all', activity: 'week', picked: null, showAll: false,
    showIdle: false, showHidden: false, openSession: null
};
var CHOICES = {
    headerPeriod: [['today', 'Today'], ['all', 'All']],
    codePeriod: [['today', 'Today'], ['all', 'All']],
    metric: [['cost', 'Cost'], ['tokens', 'Tokens']],
    grain: [['day', 'Day'], ['week', 'Week'], ['month', 'Month']],
    sessionFilter: [['all', 'All'], ['active', 'Active']],
    activity: [['week', '7d'], ['calendar', '5mo'], ['hourly', 'Hourly'], ['weekly', 'Weekly'],
               ['tod', 'Time of day']]
};
var GRAIN_COUNT = {day: 30, week: 12, month: 12};
var TOOL_NAMES = {
    read: 'Read', editWrite: 'Edit / Write', search: 'Search', git: 'Git',
    buildTest: 'Build / Test', terminal: 'Terminal', subagents: 'Subagents', web: 'Web'
};
var PATH_NAMES = {
    product_code: 'Product code', test_code: 'Tests', docs_spec: 'Docs / Spec',
    config_build: 'Config / Build', schema_migration: 'Schema / Migration',
    vendor: 'Vendor', asset: 'Assets'
};
var AGENT_NAMES = {claude: 'Claude', codex: 'Codex', antigravity: 'Antigravity'};
var SESSION_LIMIT = 5;

try {
    var stored = JSON.parse(localStorage.getItem('usage-view') || '{}');
    ['headerPeriod', 'codePeriod', 'metric', 'grain', 'sessionFilter', 'activity'].forEach(function (key) {
        if (stored[key]) { view[key] = stored[key]; }
    });
} catch (error) { /* 저장소가 막혀 있어도 기본값으로 그린다 */ }

function remember() {
    try {
        localStorage.setItem('usage-view', JSON.stringify({
            headerPeriod: view.headerPeriod, codePeriod: view.codePeriod, metric: view.metric,
            grain: view.grain, sessionFilter: view.sessionFilter, activity: view.activity
        }));
    } catch (error) { /* 무시 */ }
}

var scrollTimer = null;
window.addEventListener('scroll', function () {
    document.documentElement.classList.add('scrolling');
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
        document.documentElement.classList.remove('scrolling');
    }, 700);
}, {passive: true});

function send(message) {
    window.chrome.webview.postMessage(message);
}

function el(id) { return document.getElementById(id); }

function esc(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (c) {
        return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
    });
}

function setTheme(theme) {
    var root = document.documentElement;
    Object.keys(theme).forEach(function (key) {
        root.style.setProperty('--' + key, theme[key]);
    });
    root.style.colorScheme = theme.dark ? 'dark' : 'light';
    root.classList.toggle('dark', !!theme.dark);
    root.style.setProperty('--series2', theme.dark ? '#c98430' : theme.warn);
    if (latest) { render(latest); }
}

function setProgress(value) {
    var banner = el('indexing');
    if (value === null || value >= 1) { banner.hidden = true; return; }
    banner.hidden = false;
    el('indexing-text').textContent = 'Indexing usage history… ' + Math.round(value * 100) + '%';
    el('indexing-bar').style.width = (value * 100).toFixed(1) + '%';
}

/* 칸 하나가 유난히 바쁘면 나머지가 다 같은 색이 된다. 제곱근으로 눌러 편다. */
function level(count, peak) {
    if (!count) { return 0; }
    return Math.max(1, Math.min(LEVELS, Math.round(Math.sqrt(count / peak) * LEVELS)));
}

function shade(level) {
    if (!level) { return 'color-mix(in srgb, var(--face) 70%, var(--grid))'; }
    var ratio = Math.round(level / LEVELS * 100);
    return 'color-mix(in srgb, var(--accent) ' + ratio + '%, var(--grid))';
}

function money(value, digits) {
    var currency = (latest && latest.currency) || 'USD';
    var rate = currency === 'USD' ? 1 : ((latest && latest.rate) || 1);
    var symbol = {USD: '$', KRW: '₩', CNY: '¥'}[currency] || '$';
    if (currency === 'KRW') { digits = 0; }
    return symbol + (value * rate).toLocaleString('en-US', {
        minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0});
}

function count(value) {
    value = value || 0;
    var abs = Math.abs(value);
    if (abs >= 1e9) { return (value / 1e9).toFixed(1) + 'B'; }
    if (abs >= 1e6) { return (value / 1e6).toFixed(1) + 'M'; }
    if (abs >= 1e3) { return (value / 1e3).toFixed(1) + 'K'; }
    return String(Math.round(value));
}

function signed(value) {
    return (value > 0 ? '+' : value < 0 ? '−' : '') + count(Math.abs(value));
}

function ago(ms) {
    var seconds = Math.max(0, (Date.now() - ms) / 1000);
    if (seconds < 60) { return 'just now'; }
    if (seconds < 3600) { return Math.floor(seconds / 60) + 'm ago'; }
    if (seconds < 86400) { return Math.floor(seconds / 3600) + 'h ago'; }
    return Math.floor(seconds / 86400) + 'd ago';
}

function shortDay(day) { return day.slice(5).replace('-', '/'); }

function toDate(day) {
    var parts = day.split('-');
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function dayKey(date) {
    return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' +
        String(date.getDate()).padStart(2, '0');
}

/* 묶는 단위의 열쇠. 주는 월요일에서 시작한다. */
function bucketOf(day, grain) {
    if (grain === 'day') { return day; }
    if (grain === 'month') { return day.slice(0, 7); }
    var date = toDate(day);
    date.setDate(date.getDate() - (date.getDay() + 6) % 7);
    return dayKey(date);
}

function bucketLabel(key, grain) {
    if (grain === 'month') { return key.slice(5) + '/' + key.slice(2, 4); }
    return shortDay(key);
}

/* 막대 그림 한 장. points = [{value, title, key, now}], 음수가 있으면 0 선을 가운데로
   올린다. 축은 언제나 0 에서 시작한다 (막대 길이가 곧 값이다). */
function bars(points, options) {
    options = options || {};
    var high = Math.max.apply(null, [0].concat(points.map(function (p) { return p.value; })));
    var low = Math.min.apply(null, [0].concat(points.map(function (p) { return p.value; })));
    var range = (high - low) || 1;
    var zero = -low / range * 100;
    var html = '<div class="bars' + (low < 0 ? ' signed' : '') + (options.small ? ' small' : '') + '">';
    if (low < 0) { html += '<span class="zero" style="bottom:' + zero.toFixed(2) + '%"></span>'; }
    points.forEach(function (p) {
        var size = Math.abs(p.value) / range * 100;
        var style = p.value < 0
            ? 'bottom:' + (zero - size).toFixed(2) + '%;height:' + size.toFixed(2) + '%'
            : 'bottom:' + zero.toFixed(2) + '%;height:' + size.toFixed(2) + '%';
        // 0 이 아닌 값은 1px 이라도 보이게 한다.
        if (p.value) { style += ';min-height:1px'; }
        html += '<span class="slot' + (p.now ? ' now' : '') + (p.picked ? ' picked' : '') + '"' +
            (p.key ? ' data-bucket="' + p.key + '"' : '') + ' title="' + esc(p.title || '') + '">' +
            (p.value ? '<i class="' + (p.value < 0 ? 'neg' : '') + '" style="' + style + '"></i>' : '') +
            '</span>';
    });
    return html + '</div>';
}

function chart(head, body, axis) {
    return '<div class="chart"><div class="chart-head">' + head + '</div>' + body +
        (axis ? '<div class="axis">' + axis + '</div>' : '') + '</div>';
}

/* 카드별 뼈대. 높이는 실제로 그려진 카드를 재서 맞췄다 (469px 창 기준). */
function sk(width, height) {
    return '<span class="sk' + (height ? '' : ' line') + '" style="width:' + width +
        (height ? ';height:' + height + 'px' : '') + '"></span>';
}

var SKELETON = {
    limits: function () {
        var row = '<div class="sk-stack">' + '<div class="sk-row" style="height:17px">' + sk('38%') +
            sk('12%') + '</div>' + sk('100%', 6) + '</div>';
        return [row, row, row, row, row].join('<div style="height:14px"></div>');
    },
    code: function () {
        var kpi = '<div class="sk-stack" style="align-items:center;display:flex;flex-direction:column">' +
            sk('60%') + sk('40%', 16) + sk('50%') + '</div>';
        return '<div class="kpis">' + kpi + kpi + kpi + '</div>' +
            '<div class="chart" style="margin-top:14px">' + '<div class="sk-row" style="margin-bottom:6px">' +
            sk('35%') + sk('30%') + '</div>' + sk('100%', 64) + '<div style="height:45px"></div></div>';
    },
    trend: function () {
        return '<div class="chart">' + sk('40%') + '<div style="height:5px"></div>' + sk('100%', 64) + '</div>' +
            '<div class="chart">' + sk('35%') + '<div style="height:5px"></div>' + sk('100%', 34) +
            '<div style="height:24px"></div></div>';
    },
    sessions: function () {
        return '<div class="sk-stack">' + '<div class="sk-row">' + sk('45%') + sk('15%') + '</div>' +
            sk('70%') + sk('100%', 6) + sk('40%') + '</div>' +
            '<div style="height:48px"></div>' + sk('35%');
    },
    activity: function () {
        return '<div class="heat-box" style="width:100%;max-width:var(--chart-max)">' + sk('100%', 110) +
            '<div style="height:8px"></div><div class="sk-row" style="justify-content:flex-end">' +
            sk('30%') + '</div></div>';
    },
    models: function () {
        var row = '<div class="sk-stack">' + '<div class="sk-row">' + sk('40%') + sk('28%') + '</div>' +
            sk('100%', 6) + '</div>';
        return [row, row, row, row, row].join('<div style="height:12px"></div>');
    }
};

document.querySelectorAll('[data-skeleton]').forEach(function (host) {
    host.innerHTML = SKELETON[host.getAttribute('data-skeleton')]();
});

/* 한도 줄·세션 수는 그때그때 달라 뼈대 모양만으로는 키를 못 맞춘다. 지난번에 그려진
   묶음·카드 높이를 앱이 실어 주면 (usageview.load_page) 첫 값이 올 때까지 그 높이로
   못박아 둔다 (뼈대가 더 길면 잘린다). 단 수가 다르면 폭이 달라 키도 다르니 쓰지 않는다. */
var SECTION_HEIGHTS = {};
var reserved = [];

/* 접은 판. 앱이 설정에서 실어 주고 (usageview.load_page), 접고 펼 때마다 돌려보낸다. */
var FOLDED = [];
var FOLD_ICON = '<svg viewBox="0 0 10 10"><path d="M1.5 3.25 5 6.75 8.5 3.25" ' +
    'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" ' +
    'stroke-linejoin="round"/></svg>';

document.querySelectorAll('section[data-id] > h2:not(.solo)').forEach(function (band) {
    var node = band.parentElement;
    // 띠의 맨 앞 글씨(제목)를 꺾쇠와 함께 접기 단추 하나로 감싼다. 띠의 나머지는 누르지 않는다.
    var title = band.firstChild;
    var button = document.createElement('button');
    button.className = 'fold';
    button.innerHTML = FOLD_ICON;
    button.appendChild(document.createTextNode(title.textContent.trim()));
    band.replaceChild(button, title);
    node.classList.toggle('folded', FOLDED.indexOf(node.getAttribute('data-id')) >= 0);
    button.title = node.classList.contains('folded') ? 'Unfold' : 'Fold';
    button.addEventListener('click', function (event) {
        event.stopPropagation();
        node.classList.toggle('folded');
        button.title = node.classList.contains('folded') ? 'Unfold' : 'Fold';
        FOLDED = [].map.call(document.querySelectorAll('section.folded[data-id]'), function (item) {
            return item.getAttribute('data-id');
        });
        send('folds:' + JSON.stringify(FOLDED));
        snapButtons(node);
        layoutSections();
        reportSections();
    });
});

function reserveSections() {
    if (SECTION_HEIGHTS.columns !== getColumnCount()) { return; }
    Object.keys(SECTION_HEIGHTS.sections || {}).forEach(function (id) {
        var node = document.querySelector('section[data-id="' + id + '"]');
        var card = node && node.querySelector('.card');
        if (!card || node.classList.contains('folded')) { return; }
        node.style.height = SECTION_HEIGHTS.sections[id][0] + 'px';
        card.style.height = SECTION_HEIGHTS.sections[id][1] + 'px';
        card.style.overflow = 'hidden';
        reserved.push(node, card);
    });
}

function releaseSections() {
    reserved.forEach(function (node) { node.style.height = ''; node.style.overflow = ''; });
    reserved = [];
}

/* 그린 뒤의 높이를 앱에 알린다. 1 분마다 그리므로 바뀌었을 때만 보낸다. */
function reportSections() {
    var sections = {};
    document.querySelectorAll('section[data-id]').forEach(function (node) {
        var card = node.querySelector('.card');
        // 접은 판은 키를 남기지 않는다. 다음 시작 때 펼쳐 뼈대를 그 키로 못박으면 안 된다.
        if (!node.hidden && card && !node.classList.contains('folded')) {
            sections[node.getAttribute('data-id')] = [node.offsetHeight, card.offsetHeight];
        }
    });
    var value = JSON.stringify({columns: getColumnCount(), sections: sections});
    if (value !== JSON.stringify(SECTION_HEIGHTS)) {
        SECTION_HEIGHTS = JSON.parse(value);
        send('heights:' + value);
    }
}

setTimeout(function () {
    if (!latest) { reserveSections(); }
    layoutSections();
}, 0);

/* 칸은 한 번만 만들고 그 뒤로는 고른 칸 표시만 바꾼다. 누를 때마다 새로 만들면 손 아래의
   단추가 바뀌어 hover 가 풀렸다 다시 걸리며 깜빡인다. */
function drawControls() {
    document.querySelectorAll('[data-control]').forEach(function (host) {
        var name = host.getAttribute('data-control');
        if (!host.children.length) {
            host.innerHTML = CHOICES[name].map(function (choice) {
                return '<button data-value="' + choice[0] + '">' + choice[1] + '</button>';
            }).join('');
        }
        [].forEach.call(host.children, function (button) {
            button.classList.toggle('on', button.getAttribute('data-value') === view[name]);
        });
    });
    snapButtons(document);
}

/* 단추 폭을 정수 화소로. 글씨 폭대로 두면 소수점 폭이 되어 오른쪽 맞춤한 단추와 그 글씨가
   반 칸에 걸리고, 가는 획(l·i)이 두 화소에 갈려 흐리게 번진다(사용자 "찌글찌글"). 보이는
   단추만 잰다 — 접힌 판 안의 단추는 펼칠 때 잰다. */
function snapButtons(root) {
    root.querySelectorAll('.seg button, button.primary, h2 .fold, .controls .label').forEach(function (button) {
        if (button.dataset.snapped === button.textContent) { return; }
        button.style.width = '';
        var width = button.getBoundingClientRect().width;
        if (!width) { return; }
        button.style.width = Math.ceil(width) + 'px';
        button.dataset.snapped = button.textContent;
    });
}

/* 단 폭도 정수 화소로 나눈다. 남는 화소는 앞 단부터 하나씩. */
function sizeColumns() {
    var host = el('sections');
    var columns = host.querySelectorAll(':scope > .masonry-column');
    if (!columns.length) { return; }
    var gap = parseFloat(getComputedStyle(host).columnGap) || 0;
    var room = host.clientWidth - gap * (columns.length - 1);
    var width = Math.floor(room / columns.length);
    var extra = room - width * columns.length;
    columns.forEach(function (column, index) {
        column.style.flex = '0 0 ' + (width + (index < extra ? 1 : 0)) + 'px';
    });
}

document.addEventListener('click', function (event) {
    var target = event.target.closest('button, [data-bucket], [data-act]');
    if (!target) { return; }
    var control = target.parentElement && target.parentElement.getAttribute('data-control');
    if (control) {
        view[control] = target.getAttribute('data-value');
        if (control === 'grain') { view.picked = null; }
        remember();
        render(latest);
        return;
    }
    if (target.hasAttribute('data-bucket')) {
        var key = target.getAttribute('data-bucket');
        view.picked = view.picked === key ? null : key;
        render(latest);
        return;
    }
    var act = target.getAttribute('data-act');
    if (!act) { return; }
    var arg = target.getAttribute('data-arg') || '';
    if (act === 'toggle-session') { view.openSession = view.openSession === arg ? null : arg; }
    else if (act === 'more') { view.showAll = !view.showAll; }
    else if (act === 'idle') { view.showIdle = !view.showIdle; }
    else if (act === 'hidden') { view.showHidden = !view.showHidden; }
    else { send(act + ':' + arg); return; }
    render(latest);
});

/* 머리판 ------------------------------------------------------------- */
function drawHeader(data) {
    var all = view.headerPeriod === 'all';
    var totals = all ? data.all : data.today;
    el('cost-caption').textContent = all ? 'All-time cost' : 'Today cost';
    el('ratio-caption').textContent = all ? 'Avg cache efficiency' : 'Cache efficiency';
    el('cost').textContent = money(totals.cost);
    el('calls').textContent = count(totals.calls) + ' calls  /  ' + totals.sessions + ' sessions';
    el('ratio').textContent = Math.round(totals.ratio * 100) + '%';
    el('saved').textContent = '+ ' + money(totals.saved) + (all ? ' saved total' : ' saved today');
}

/* 한도 --------------------------------------------------------------- */
function drawPlans(plans) {
    el('plans').innerHTML = (plans || []).map(function (plan) {
        return '<span class="plan"><span class="provider ' + plan.provider + '">' +
            AGENT_NAMES[plan.provider].toUpperCase() + '</span>' + esc(plan.name) + '</span>';
    }).join('');
}

var loginState = null;
var LOGIN_TEXT = {
    working: 'Signing in…',
    refreshed: 'Signed in. Reading plan limits…',
    login: 'Finish signing in in the terminal window. Limits come back by themselves.',
    missing: 'Claude Code was not found on this PC.',
    failed: 'Could not open the sign-in window.'
};

function setLoginState(state) {
    loginState = state;
    if (latest) { drawLimits(latest.limits, latest.claude_status); }
}

function limitNote(status) {
    if (!status) { loginState = null; return ''; }
    var reason = status.error === 'expired'
        ? 'Claude sign-in token expired.'
        : 'Could not reach Claude for plan limits.';
    var shown = status.age === null ? ' No earlier snapshot to show.'
        : ' Showing the last snapshot from ' + ago(Date.now() - status.age * 1000) + '.';
    // 만료일 때만 단추를 둔다. 연결이 안 되는 것은 다시 로그인해도 풀리지 않는다.
    var action = '';
    if (loginState) {
        action = '<div class="limit-login">' + esc(LOGIN_TEXT[loginState] || '') + '</div>';
    } else if (status.error === 'expired') {
        action = '<button class="link limit-login" data-act="claude-login">Sign in</button>';
    }
    return '<div class="limit-note">' + esc(reason + shown) + action + '</div>';
}

function drawLimits(limits, status) {
    var host = el('limits');
    if (limits === null) {
        host.innerHTML = limitNote(status) || '<div class="empty">plan limits unavailable</div>';
        return;
    }
    if (!limits.length) {
        host.innerHTML = '<div class="empty">nothing running against a limit</div>';
        return;
    }
    // 도구마다 묶는다. 묶음 머리에 아이콘·이름·플랜을 두므로 줄 이름의 "Codex · " 는 뗀다.
    var plans = {};
    ((latest && latest.plans) || []).forEach(function (plan) { plans[plan.provider] = plan.name; });
    var groups = [];
    limits.forEach(function (limit) {
        var provider = limit.provider || 'claude';
        var group = groups[groups.length - 1];
        if (!group || group.provider !== provider) {
            group = {provider: provider, limits: []};
            groups.push(group);
        }
        group.limits.push(limit);
    });
    host.innerHTML = groups.map(function (group) {
        return '<div class="limit-group">' +
            '<div class="limit-brand ' + group.provider + '">' + brandIcon(group.provider) +
            '<span class="brand-name">' + esc(AGENT_NAMES[group.provider] || group.provider) + '</span>' +
            '<span class="brand-plan">' + esc(plans[group.provider] || '') + '</span></div>' +
            group.limits.map(drawLimit).join('') +
            (group.provider === 'codex' ? drawResets(latest && latest.codex_resets) : '') + '</div>';
    }).join('');
    host.insertAdjacentHTML('afterbegin', limitNote(status));
}

/* 묶음 머리의 아이콘. 각 앱 패키지의 아이콘을 앱이 페이지를 띄울 때 바로 싣는다
   (usageview.get_brand_sources). Codex 는 바탕에 따라 흰·검정 두 벌을 갈아 쓴다. */
var BRAND_SRC = {};

function brandIcon(provider) {
    function img(key, extra) {
        return BRAND_SRC[key] ? '<img class="brand-icon' + (extra || '') + '" src="' + BRAND_SRC[key] + '" alt="">' : '';
    }
    if (provider === 'codex') { return img('codex-dark', ' on-dark') + img('codex-light', ' on-light'); }
    return img(provider);
}

/* 남은 시간을 짧게. 한도가 풀리기까지의 큰 글자에 쓴다. */
function countdown(until) {
    var seconds = Math.max(0, Math.round(until - Date.now() / 1000));
    var days = Math.floor(seconds / 86400);
    var hours = Math.floor(seconds % 86400 / 3600);
    var minutes = Math.floor(seconds % 3600 / 60);
    if (days) { return days + 'd ' + hours + 'h'; }
    if (hours) { return hours + 'h ' + minutes + 'm'; }
    return Math.max(1, minutes) + 'm';
}

/* 풀리는 시각을 이 곳 시간으로. 물은 때와 받은 때의 몇 초 어긋남에 분이 흔들리지 않게 반올림한다. */
var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function clock(at) {
    var date = new Date(Math.round(at / 60) * 60000);
    function pad(value) { return (value < 10 ? '0' : '') + value; }
    return (date.getMonth() + 1) + '/' + date.getDate() + ' ' + WEEKDAYS[date.getDay()] + ' ' +
        pad(date.getHours()) + ':' + pad(date.getMinutes());
}

var RESET_SOON = 24 * 3600;

function drawResets(resets) {
    if (!resets) { return ''; }
    var now = Date.now() / 1000;
    // 1 분마다 다시 모으기 전에 만료된 것은 여기서 뺀다.
    var credits = resets.credits.filter(function (credit) { return !credit.expires || credit.expires > now; });
    var next = credits.length && credits[0].expires;
    var chips = credits.map(function (credit, order) {
        var soon = credit.expires && credit.expires - now < RESET_SOON;
        return '<span class="reset-chip' + (soon ? ' soon' : '') + '" title="' + esc(credit.title) + '">#' +
            (order + 1) + ' <b class="num" data-until="' + (credit.expires || '') + '">' +
            (credit.expires ? countdown(credit.expires) : 'no expiry') + '</b>' + (soon ? ' · soon' : '') + '</span>';
    }).join('');
    return '<div class="resets' + (resets.stale ? ' stale' : '') + '">' +
        '<div class="head"><span class="name">Force resets</span>' +
        '<span class="when">' + (next ? 'next expires in <span data-until="' + next + '">' + countdown(next) + '</span>' : '') +
        (resets.stale ? ' · cached' : '') + '</span>' +
        '<span class="count num">' + credits.length + ' available</span></div>' +
        (chips ? '<div class="reset-chips">' + chips + '</div>' : '') + '</div>';
}

function drawCountdowns() {
    document.querySelectorAll('.resets [data-until]').forEach(function (node) {
        if (node.getAttribute('data-until')) { node.textContent = countdown(+node.getAttribute('data-until')); }
    });
    document.querySelectorAll('.limit-lift .time-left').forEach(function (node) {
        node.textContent = countdown(+node.getAttribute('data-until'));
    });
}

function drawLimit(limit) {
    var tint = limit.severity === 'critical' || limit.reached ? 'var(--close)'
        : limit.severity === 'warning' ? 'var(--warn)' : 'var(--accent)';
    var name = limit.name.replace(/^Codex · /, '');
    var lift = !limit.reached ? '' :
        '<div class="limit-lift"><span class="time-left num" style="color:' + tint +
        '" data-until="' + limit.until + '">' + countdown(limit.until) + '</span>' +
        '<span class="lift-caption">until this limit lifts · ' + clock(limit.until) + '</span></div>';
    return '<div class="limit' + (limit.stale ? ' stale' : '') + (limit.reached ? ' reached' : '') + '">' +
        '<div class="head"><span class="name">' + esc(name) + '</span>' +
        '<span class="when">' + esc(limit.when) + (limit.reset_at ? ' · ' + clock(limit.reset_at) : '') +
        (limit.stale ? ' · cached' : '') + '</span>' +
        '<span class="elapsed">' + (limit.elapsed === null ? '' : limit.elapsed + '% elapsed') +
        '</span><span class="pct num" style="color:' + tint + '">' + limit.percent + '%</span></div>' +
        '<div class="bar">' +
        (limit.elapsed === null ? '' : '<i class="time" style="width:' + limit.elapsed + '%"></i>') +
        '<i style="width:' + Math.min(100, limit.percent) + '%;background:' + tint + '"></i>' +
        '</div>' + lift + '</div>';
}

/* 코드 산출 ---------------------------------------------------------- */
function sumCode(code, days) {
    var total = {commits: 0, added: 0, removed: 0, paths: {}};
    days.forEach(function (day) {
        var item = code[day];
        if (!item) { return; }
        total.commits += item.commits;
        total.added += item.added;
        total.removed += item.removed;
        Object.keys(item.paths).forEach(function (name) {
            var slot = total.paths[name] || (total.paths[name] = [0, 0]);
            slot[0] += item.paths[name][0];
            slot[1] += item.paths[name][1];
        });
    });
    return total;
}

function drawCode(data) {
    var host = el('code');
    var code = data.code || {};
    var days = Object.keys(code).sort();
    if (!days.length) {
        // 처음 git 을 세는 몇 초 동안은 뼈대를 그대로 둔다. 다 세고도 없을 때만 알린다.
        host.innerHTML = data.repos ? '<div class="empty">no commits yet</div>' : SKELETON.code();
        return;
    }
    var today = data.activity.today;
    var all = view.codePeriod === 'all';
    var pick = all ? days : [today];
    var total = sumCode(code, pick);
    var everything = sumCode(code, days);
    var net = total.added - total.removed;
    var cost = all ? data.all.cost : data.today.cost;
    var per100 = total.added ? cost / total.added * 100 : 0;

    var html = '<div class="kpis">' +
        '<div class="kpi"><div class="caption">Commits</div><div class="value num">' +
        total.commits + '</div><div class="note num">' +
        (all ? 'all time' : everything.commits + ' total') + '</div></div>' +
        '<div class="kpi"><div class="caption">Net lines</div><div class="value num">' +
        signed(net) + '</div><div class="note num">' +
        count(total.added + total.removed) + ' lines</div></div>' +
        '<div class="kpi"><div class="caption">$/100 added</div><div class="value num">' +
        (total.added ? money(per100, 2) : '—') + '</div><div class="note num">avg ' +
        money(everything.added ? data.all.cost / everything.added * 100 : 0, 2) + '</div></div>' +
        '</div>';

    // 지난 7 일의 하루 순증. 늘면 위로(파랑), 줄면 아래로(주황).
    var week = [];
    for (var offset = 6; offset >= 0; offset -= 1) {
        var date = toDate(today);
        date.setDate(date.getDate() - offset);
        week.push(dayKey(date));
    }
    var points = week.map(function (day) {
        var gain = code[day] ? code[day].added - code[day].removed : 0;
        return {value: gain, now: day === today, title: shortDay(day) + '  ' + signed(gain) + ' net lines'};
    });
    var weekNet = points.reduce(function (sum, p) { return sum + p.value; }, 0);
    var totalNet = everything.added - everything.removed;
    html += '<div style="margin-top:14px">' + chart(
        '<span>Net lines · last 7 days</span><span><b>' + signed(weekNet) + '</b> this week · ' +
        signed(totalNet) + ' all time</span>',
        bars(points),
        week.map(function (day) { return '<span>' + shortDay(day) + '</span>'; }).join('')) +
        '<div class="note" style="text-align:center;margin-top:6px">' + data.repos + ' repos</div></div>';
    host.innerHTML = html;
}

/* 추세 --------------------------------------------------------------- */
function getBuckets(data) {
    var grain = view.grain;
    var buckets = {};
    function slot(key) {
        return buckets[key] || (buckets[key] = {
            key: key, cost: 0, tokens: 0, calls: 0, net: 0, days: []});
    }
    Object.keys(data.daily).forEach(function (day) {
        var item = data.daily[day];
        var bucket = slot(bucketOf(day, grain));
        bucket.cost += item.cost;
        bucket.tokens += item.tokens;
        bucket.calls += item.calls;
        bucket.days.push(day);
    });
    var first = Object.keys(buckets).sort()[0];
    Object.keys(data.code || {}).forEach(function (day) {
        var key = bucketOf(day, grain);
        // 쓰기 전의 옛 커밋까지 그리면 그림이 좌우로 갈라진다. 사용 기록이 시작된 뒤만.
        if (first && key < first) { return; }
        var bucket = slot(key);
        bucket.net += data.code[day].added - data.code[day].removed;
        if (bucket.days.indexOf(day) < 0) { bucket.days.push(day); }
    });
    return Object.keys(buckets).sort().slice(-GRAIN_COUNT[grain]).map(function (key) {
        return buckets[key];
    });
}

function drawTrend(data) {
    var host = el('trend');
    var points = getBuckets(data);
    if (!points.length) {
        host.innerHTML = '<div class="empty">No trend data yet</div>';
        el('breakdown').hidden = true;
        return;
    }
    var metric = view.metric;
    function format(value, digits) { return metric === 'cost' ? money(value, digits) : count(value); }
    var last = points.length - 1;
    var current = bucketOf(data.activity.today, view.grain);
    var peak = Math.max.apply(null, points.map(function (p) { return p[metric]; }));
    var axis = '<span>' + bucketLabel(points[0].key, view.grain) + '</span><span>' +
        bucketLabel(points[last].key, view.grain) + '</span>';

    function slots(value) {
        return points.map(function (p) {
            return {value: value(p), key: p.key, now: p.key === current, picked: p.key === view.picked,
                    title: bucketLabel(p.key, view.grain) + '  ' + format(p[metric], 2) + '  ' +
                        p.calls + ' requests  ' + signed(p.net) + ' net lines'};
        });
    }
    // 돈(또는 토큰)과 순증 줄은 단위가 달라 한 축에 겹치지 않는다. 날짜 축을 맞춘 두 장.
    host.innerHTML =
        chart('<span>' + (metric === 'cost' ? 'Cost' : 'Tokens') + ' · peak ' + format(peak) +
              '</span><span>now <b>' + format(points[last][metric]) + '</b></span>',
              bars(slots(function (p) { return p[metric]; }))) +
        chart('<span>Net lines committed</span><span>now <b>' + signed(points[last].net) + '</b></span>',
              bars(slots(function (p) { return p.net; }), {small: true}), axis);
    drawBreakdown(data, points);
}

function meterRows(rows, top, formatter) {
    return rows.map(function (row) {
        return '<div class="meter"><span>' + esc(row[0]) + '</span><span class="track"><i style="width:' +
            (top ? row[1] / top * 100 : 0).toFixed(2) + '%"></i></span><span class="val num">' +
            formatter(row) + '</span></div>';
    }).join('');
}

function drawBreakdown(data, points) {
    var host = el('breakdown');
    var bucket = null;
    points.forEach(function (point) { if (point.key === view.picked) { bucket = point; } });
    if (!bucket) { host.hidden = true; return; }
    host.hidden = false;

    var panorama = [0, 0, 0, 0, 0];
    var tools = {};
    bucket.days.forEach(function (day) {
        var item = data.daily[day];
        if (!item) { return; }
        item.panorama.forEach(function (value, index) { panorama[index] += value || 0; });
        Object.keys(item.tools).forEach(function (name) {
            var slot = tools[name] || (tools[name] = [0, 0]);
            slot[0] += item.tools[name][0];
            slot[1] += item.tools[name][1];
        });
    });
    var code = sumCode(data.code || {}, bucket.days);

    var tokenRows = [['Input', panorama[0]], ['Output', panorama[1]], ['Cache read', panorama[2]],
                     ['Cache write', panorama[3]], ['Thinking', panorama[4]]];
    var tokenTop = Math.max.apply(null, tokenRows.map(function (r) { return r[1]; }));
    var toolRows = Object.keys(tools).map(function (name) {
        return [TOOL_NAMES[name] || name, tools[name][0], tools[name][1]];
    }).sort(function (a, b) { return b[1] - a[1]; });
    var toolTop = toolRows.length ? toolRows[0][1] : 0;
    var pathRows = Object.keys(code.paths).map(function (name) {
        return [PATH_NAMES[name] || name, code.paths[name][0] - code.paths[name][1],
                code.paths[name][0], code.paths[name][1]];
    }).sort(function (a, b) { return Math.abs(b[1]) - Math.abs(a[1]); });
    var pathTop = Math.max.apply(null, [0].concat(pathRows.map(function (r) { return Math.abs(r[1]); })));

    host.innerHTML =
        '<h3><span>' + (view.grain === 'week' ? 'Week ' : '') + bucketLabel(bucket.key, view.grain) +
        '</span><span class="note num">' + money(bucket.cost, 2) + ' · ' + bucket.calls +
        ' requests</span></h3>' +
        '<h3><span>Token panorama</span><span class="note">input + output · cache</span></h3>' +
        meterRows(tokenRows, tokenTop, function (r) { return count(r[1]); }) +
        '<h3><span>Tool usage</span><span class="note">calls · ≈tok</span></h3>' +
        (toolRows.length ? meterRows(toolRows, toolTop, function (r) {
            return r[1] + ' · ≈' + count(r[2]);
        }) : '<div class="empty">No tool data</div>') +
        '<h3><span>Net lines committed</span><span class="note num">' + count(code.added) +
        ' added / ' + count(code.removed) + ' removed</span></h3>' +
        (pathRows.length ? meterRows(pathRows.map(function (r) {
            return [r[0], Math.abs(r[1]), r[1]];
        }), pathTop, function (r) { return signed(r[2]); }) :
            '<div class="empty">No commits for this period</div>');
}

/* 세션 --------------------------------------------------------------- */
function drawSessions(data) {
    var host = el('sessions');
    var hidden = data.hidden || [];
    var rows = data.sessions.filter(function (item) {
        return view.showHidden || hidden.indexOf(item.project) < 0;
    });
    var live = rows.filter(function (item) { return item.state !== 'idle'; });
    var idle = rows.length - live.length;
    if (view.sessionFilter === 'active') {
        rows = live;
    } else if (!view.showIdle) {
        // 일 없는 세션은 접어 둔다. 살아 있는 것이 하나도 없으면 최근 것을 보인다.
        rows = live.length ? live : rows;
    }
    var shown = view.showAll ? rows : rows.slice(0, SESSION_LIMIT);

    var html = shown.length ? shown.map(function (item) {
        var pct = item.contextMax ? Math.min(100, item.context / item.contextMax * 100) : 0;
        var key = item.provider + ':' + item.session;
        var open = view.openSession === key;
        var tools = Object.keys(item.tools || {}).map(function (name) {
            return [TOOL_NAMES[name] || name, item.tools[name]];
        }).sort(function (a, b) { return b[1] - a[1]; });
        var toolTotal = tools.reduce(function (sum, row) { return sum + row[1]; }, 0);
        var state = pct >= 95 ? 'at limit' : pct >= 85 ? 'compact soon' : pct >= 70 ? 'near limit' : '';
        return '<div class="session">' +
            '<div class="top"><span class="provider ' + item.provider + '">' +
            AGENT_NAMES[item.provider].toUpperCase() + '</span>' +
            '<span class="project">' + esc(item.project || '(no folder)') + '</span>' +
            '<span class="chip ' + item.state + '">' + item.state + '</span>' +
            '<span class="ago note">' + ago(item.last) + '</span></div>' +
            '<div class="meta note num">' +
            (item.model ? '<span>' + esc(item.model) + '</span>' : '') +
            (item.source ? '<span>' + esc(item.source) + '</span>' : '') +
            (item.tokens ? '<span>' + count(item.tokens) + ' tok</span>' : '') +
            (item.cost ? '<span>' + money(item.cost, 2) + '</span>' : '') +
            '<span>' + item.calls + (item.provider === 'antigravity' ? ' steps' : ' calls') + '</span>' +
            '</div>' +
            (item.contextMax ? '<div class="ctx note num"><span class="track"><i class="' +
                (pct >= 95 ? 'full' : pct >= 70 ? 'near' : '') + '" style="width:' + pct.toFixed(1) +
                '%"></i></span><span>Context ' + Math.round(pct) + '%' +
                (state ? ' · ' + state : ' · ' + count(item.contextMax - item.context) + ' left') +
                '</span></div>' : '') +
            (open ? '<div class="breakdown" style="margin-top:6px;padding-top:6px">' +
                (tools.length ? meterRows(tools, tools[0][1], function (r) {
                    return Math.round(r[1] / toolTotal * 100) + '%';
                }) : '<div class="empty">No tool data</div>') + '</div>' : '') +
            '<div class="actions">' +
            (item.provider !== 'antigravity' ? '<button class="link" data-act="toggle-session" data-arg="' +
                esc(key) + '">' + (open ? 'Hide breakdown' : 'Show breakdown') + '</button>' : '') +
            (item.project ? '<button class="link" data-act="' +
                (hidden.indexOf(item.project) < 0 ? 'hide' : 'unhide') + '" data-arg="' +
                esc(item.project) + '">' + (hidden.indexOf(item.project) < 0 ? 'Hide' : 'Unhide') +
                '</button><button class="link" data-act="exclude" data-arg="' + esc(item.project) +
                '">Exclude</button>' : '') +
            '</div></div>';
    }).join('') : '<div class="empty">No active sessions</div>';

    var foot = [];
    if (rows.length > SESSION_LIMIT) {
        foot.push('<button class="link" data-act="more">' +
            (view.showAll ? 'Show less' : 'Show ' + (rows.length - SESSION_LIMIT) + ' more') + '</button>');
    }
    if (view.sessionFilter === 'all' && idle && live.length) {
        foot.push('<button class="link" data-act="idle">' + (view.showIdle ? 'Hide ' : 'Show ') +
            idle + ' idle session' + (idle === 1 ? '' : 's') + '</button>');
    }
    if (hidden.length) {
        foot.push('<button class="link" data-act="hidden">' + hidden.length + ' hidden project' +
            (hidden.length === 1 ? '' : 's') + ' · ' + (view.showHidden ? 'hide' : 'show') + '</button>');
    }
    if (foot.length) { html += '<div class="sessions-foot">' + foot.join('') + '</div>'; }
    host.innerHTML = html;
}

/* 활동 --------------------------------------------------------------- */
function drawWeekHeat(activity) {
    var peak = 1;
    activity.heat.forEach(function (row) {
        row.forEach(function (value) { peak = Math.max(peak, value); });
    });
    var html = '<div class="heat-box"><div class="heat"><span></span><div class="hours">';
    for (var hour = 0; hour < 24; hour += 1) {
        html += '<span class="hour-label">' + (hour % 6 === 0 ? hour : '') + '</span>';
    }
    html += '</div>';
    activity.days.forEach(function (day, row) {
        html += '<span class="row-label">' + shortDay(day) + '</span><div class="cells">';
        activity.heat[row].forEach(function (value, hour) {
            html += '<i title="' + shortDay(day) + ' ' + hour + ':00  ' + count(value) + ' tok" ' +
                'style="background:' + shade(level(value, peak)) + '"></i>';
        });
        html += '</div>';
    });
    return html + '</div>' + legend() + '</div>';
}

function drawCalendar(activity) {
    var days = activity.calendar;
    var peak = Math.max.apply(null, [1].concat(days.map(function (d) { return d[1]; })));
    var first = toDate(days[0][0]).getDay();
    var cells = '';
    for (var blank = 0; blank < first; blank += 1) { cells += '<i class="blank"></i>'; }
    cells += days.map(function (d) {
        return '<i title="' + d[0] + '  ' + count(d[1]) + ' tok" style="background:' +
            shade(level(d[1], peak)) + '"></i>';
    }).join('');
    var total = days.reduce(function (sum, d) { return sum + d[1]; }, 0);
    return '<div class="heat-box"><div class="calendar">' + cells + '</div>' + legend() +
        '<div class="activity-caption note"><span>5mo activity</span><span class="num">' +
        count(total) + ' tok</span></div></div>';
}

function drawHourly(activity) {
    var values = activity.hourly.map(function (h) { return h[0]; });
    var peak = Math.max.apply(null, values);
    var peakHour = values.indexOf(peak);
    var points = values.map(function (value, hour) {
        return {value: value, now: hour === peakHour,
                title: hour + ':00  ' + count(value) + ' tok  ' + money(activity.hourly[hour][1], 2)};
    });
    return chart('<span>Hourly · last 30 days</span><span>peak <b>' + peakHour + ':00</b></span>',
                 bars(points), '<span>0</span><span>6</span><span>12</span><span>18</span><span>23</span>');
}

function drawWeekly(activity) {
    var weeks = activity.weeks;
    var peak = Math.max.apply(null, weeks.map(function (w) { return w.tokens; })) || 1;
    var total = weeks.reduce(function (sum, w) { return sum + w.tokens; }, 0);
    return '<div class="chart">' + weeks.map(function (week, index) {
        var current = index === weeks.length - 1;
        var age = weeks.length - 1 - index;
        return '<div class="week-row' + (current ? ' current' : '') + '"><span class="note">' +
            (current ? 'current' : age + 'w ago') + '</span><span class="track"><i style="width:' +
            (week.tokens / peak * 100).toFixed(2) + '%"></i></span><span class="num" style="text-align:right">' +
            count(week.tokens) + ' · ' + money(week.cost) + '</span></div>';
    }).join('') + '<div class="activity-caption note"><span>4-week total</span><span class="num">' +
        count(total) + ' tok</span></div></div>';
}

function drawTimeOfDay(activity) {
    var parts = [['Night', 0, 6], ['Morning', 6, 12], ['Afternoon', 12, 18], ['Evening', 18, 24]];
    var rows = parts.map(function (part) {
        var sum = [0, 0, 0];
        for (var hour = part[1]; hour < part[2]; hour += 1) {
            sum[0] += activity.hourly[hour][0];
            sum[1] += activity.hourly[hour][1];
            sum[2] += activity.hourly[hour][2];
        }
        return [part[0] + ' (' + part[1] + '–' + part[2] + ')', sum];
    });
    var totalCost = rows.reduce(function (s, r) { return s + r[1][1]; }, 0);
    var peak = rows.reduce(function (best, r) { return r[1][0] > best[1][0] ? r : best; }, rows[0]);
    return '<table class="tod num"><tr><th></th><th>Tokens</th><th>Cost</th><th>Requests</th><th>%</th></tr>' +
        rows.map(function (r) {
            return '<tr' + (r === peak ? ' class="peak"' : '') + '><td>' + r[0] + '</td><td>' +
                count(r[1][0]) + '</td><td>' + money(r[1][1]) + '</td><td>' + count(r[1][2]) + '</td><td>' +
                (totalCost ? Math.round(r[1][1] / totalCost * 100) : 0) + '%</td></tr>';
        }).join('') + '</table><div class="activity-caption note"><span>Peak: ' +
        peak[0] + '</span><span class="num">30d · ' + money(totalCost) + ' total</span></div>';
}

function legend() {
    var ramp = '';
    for (var index = 0; index <= LEVELS; index += 1) {
        ramp += '<i style="background:' + shade(index) + '"></i>';
    }
    return '<div class="legend"><span>less</span>' + ramp + '<span>more</span></div>';
}

function drawActivity(data) {
    var draw = {week: drawWeekHeat, calendar: drawCalendar, hourly: drawHourly,
                weekly: drawWeekly, tod: drawTimeOfDay}[view.activity] || drawWeekHeat;
    el('activity').innerHTML = draw(data.activity);
}

/* 모델 --------------------------------------------------------------- */
function drawModels(models) {
    var host = el('models');
    if (!models.length) { host.innerHTML = '<div class="empty">No data</div>'; return; }
    var total = models.reduce(function (sum, m) { return sum + m.cost; }, 0) || 1;
    host.innerHTML = models.map(function (m) {
        return '<div class="model"><span>' + esc(m.model) +
            (m.provider ? ' <span class="provider ' + m.provider + '">' + AGENT_NAMES[m.provider] + '</span>' : '') +
            '</span><span class="num">' + money(m.cost) + ' <span class="note">' +
            Math.round(m.cost / total * 100) + '% · ' + count(m.tokens) + ' tok</span></span>' +
            '<span class="track"><i style="width:' + (m.cost / total * 100).toFixed(2) + '%"></i></span></div>';
    }).join('');
}

/* 묶음 순서·숨김은 설정에서 온다. */
var sectionOrder = null;

function arrangeSections(sections, wide) {
    document.documentElement.classList.toggle('wide', wide !== false);
    if (sections) {
        sectionOrder = sections;
        sections.forEach(function (item) {
            var node = document.querySelector('section[data-id="' + item.id + '"]');
            if (node) { node.hidden = !!item.hidden; }
        });
    }
    layoutSections();
}

function getColumnCount() {
    if (!document.documentElement.classList.contains('wide')) { return 1; }
    return innerWidth >= 1240 ? 3 : innerWidth >= 820 ? 2 : 1;
}

/* 차례를 지킨 채 count 개의 단으로 끊는다. 가장 높은 단이 가장 낮아지는 자리를
   다 따져 고른다 (묶음이 열 개 안쪽이라 전부 따져도 순식간이다).
   돌려주는 것은 단마다 첫 묶음의 자리. */
function splitColumns(heights, count) {
    var n = heights.length;
    var prefix = [0];
    heights.forEach(function (h, i) { prefix.push(prefix[i] + h); });
    var best = [], cut = [];
    for (var c = 0; c <= count; c += 1) { best.push([]); cut.push([]); }
    for (var i = 0; i <= n; i += 1) { best[1][i] = prefix[i]; cut[1][i] = 0; }
    for (c = 2; c <= count; c += 1) {
        for (i = 0; i <= n; i += 1) {
            best[c][i] = Infinity;
            for (var j = 0; j <= i; j += 1) {
                var worst = Math.max(best[c - 1][j], prefix[i] - prefix[j]);
                // 같으면 뒤쪽에서 끊는다. 묶음이 단보다 적을 때 빈 단이 앞이 아니라 끝에 남게.
                if (worst <= best[c][i]) { best[c][i] = worst; cut[c][i] = j; }
            }
        }
    }
    var starts = [], end = n;
    for (c = count; c >= 1; c -= 1) { starts.unshift(cut[c][end]); end = cut[c][end]; }
    return starts;
}

/* 묶음을 단에 나눠 담는다. 머리판이 맨 앞, Refresh 가 맨 끝, 그 사이는 설정의 차례.
   단을 다시 나누는 것은 단 수·차례·숨김·접힘이 바뀌었을 때와 첫 값이 왔을 때뿐이다. 단추를
   누르거나 1 분마다 새로 그릴 때마다 다시 나누면 판이 단 사이를 오가며 튄다(사용자). */
var splitKey = null;
// 첫 값으로 그린 뒤에야 참이다. 그 전의 나누기는 뼈대 키로 한 것이라 한 번 다시 나눈다.
var drawnOnce = false;

function layoutSections() {
    var host = el('sections');
    var nodes = {};
    host.querySelectorAll('section[data-id]').forEach(function (node) {
        nodes[node.getAttribute('data-id')] = node;
    });
    var middle = sectionOrder ? sectionOrder.map(function (item) { return item.id; })
        : Object.keys(nodes).filter(function (id) { return id !== 'header' && id !== 'refresh'; });
    var order = ['header'].concat(middle, ['refresh']).filter(function (id) { return nodes[id]; });
    Object.keys(nodes).forEach(function (id) { if (order.indexOf(id) < 0) { order.push(id); } });

    var count = getColumnCount();
    var columns = [].slice.call(host.querySelectorAll(':scope > .masonry-column'));
    if (count === 1) {
        splitKey = null;
        order.forEach(function (id) { host.appendChild(nodes[id]); });
        columns.forEach(function (column) { column.remove(); });
        host.classList.remove('masonry');
        return;
    }
    // 단 수가 그대로면 카드는 이미 단 폭으로 그려져 있다. 그 자리에서 재고, 단이
    // 바뀌는 카드만 옮긴다. 1 분마다 새로 그릴 때 카드를 통째로 뺐다 넣으면 번쩍인다.
    var settled = host.classList.contains('masonry') && columns.length === count;
    var key = [count, order.join(','), order.filter(function (id) { return nodes[id].hidden; }).join(','),
               FOLDED.join(','), drawnOnce ? 'data' : 'skeleton'].join('|');
    if (settled && key === splitKey) { return; }
    splitKey = key;
    host.classList.add('masonry');
    while (columns.length < count) {
        var column = document.createElement('div');
        column.className = 'masonry-column';
        host.appendChild(column);
        columns.push(column);
    }
    while (columns.length > count) { columns.pop().remove(); }
    sizeColumns();
    var shown = order.filter(function (id) { return !nodes[id].hidden; });
    if (!settled) {
        // 단 폭에서 키를 재야 한다. 다 첫 단에 담아 놓고 하나씩 잰다.
        shown.forEach(function (id) { columns[0].appendChild(nodes[id]); });
    }
    var heights = shown.map(function (id) {
        var node = nodes[id];
        return node.offsetHeight + (parseFloat(getComputedStyle(node).marginBottom) || 0);
    });
    var starts = splitColumns(heights, count);
    // 단마다 들어갈 카드를 차례대로 맞춰 둔다. 이미 제자리면 건드리지 않는다.
    columns.forEach(function (column, c) {
        var want = shown.filter(function (id, index) {
            var at = 0;
            starts.forEach(function (start, k) { if (index >= start) { at = k; } });
            return at === c;
        }).map(function (id) { return nodes[id]; });
        var have = [].filter.call(column.children, function (node) { return !node.hidden; });
        var same = want.length === have.length && want.every(function (node, i) { return node === have[i]; });
        if (!same) { want.forEach(function (node) { column.appendChild(node); }); }
    });
    order.forEach(function (id) {
        if (nodes[id].hidden) { columns[count - 1].appendChild(nodes[id]); }
    });
}

/* 창 크기를 바꾸는 동안에는 단 수가 바뀔 때만 다시 편다. 폭이 조금씩 변할 때마다 끊는
   자리를 다시 따지면 카드가 단 사이를 오가며 꿈틀거린다. 단 수가 바뀌면 기다리지 않고
   바로 (늦게 바꾸면 옛 배치가 한동안 보인다). */
window.addEventListener('resize', function () {
    var host = el('sections');
    var current = host.classList.contains('masonry')
        ? host.querySelectorAll(':scope > .masonry-column').length : 1;
    if (getColumnCount() !== current) { layoutSections(); }
    sizeColumns();
});

function drawUpdated() {
    if (!latest) { return; }
    el('updated').textContent = 'last run · ' + ago(latest.updated * 1000);
}

function render(data) {
    if (!data) { return; }
    latest = data;
    releaseSections();
    el('reload').disabled = false;
    drawControls();
    arrangeSections(data.sections, data.wide);
    var parts = [['header', drawHeader], ['plans', function () { drawPlans(data.plans); }],
                 ['limits', function () { drawLimits(data.limits, data.claude_status); }],
                 ['code', drawCode], ['trend', drawTrend], ['sessions', drawSessions],
                 ['activity', drawActivity], ['models', function () { drawModels(data.models); }]];
    // 한 묶음이 깨져도 나머지는 그린다.
    parts.forEach(function (part) {
        try { part[1](data); } catch (error) { console.error(part[0], error); }
    });
    drawnOnce = true;
    // 단 나누기는 새 내용의 키로 다시 한다. 위의 arrangeSections 는 옛 내용의 키로 쟀으므로,
    // 키가 바뀐 카드는 다음 갱신 때에야 제 단으로 옮겨 가며 번쩍였다.
    layoutSections();
    drawUpdated();
    reportSections();
}

setInterval(function () { drawUpdated(); drawCountdowns(); }, 15000);

el('reload').addEventListener('click', function () {
    var button = el('reload');
    button.disabled = true;
    // 단추 글씨는 그대로 둔다(폭이 변하면 띠가 밀린다). 읽는 중이라는 것은 부제가 말한다.
    el('updated').textContent = 'reading…';
    send('reload');
});

drawControls();
send('ready');
</script>
